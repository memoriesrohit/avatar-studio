<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Avatar Studio</title>
  <meta name="description" content="Realistic, rigged 3D characters you can dress, animate and export.">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo" aria-hidden="true">◆</span> Avatar Studio</div>
    <nav class="actions">
      <button id="random" title="Random character">🎲 <span>Randomize</span></button>
      <button id="share" title="Copy a link to this avatar">🔗 <span>Share</span></button>
      <div class="export">
        <button id="export" class="primary" aria-haspopup="menu" aria-expanded="false" title="Download as a 3D file or picture">⬇ <span>Export</span></button>
        <div id="export-menu" class="menu" role="menu" hidden>
          <p class="menu-note">Need FBX? Export GLB, open it in Blender (File → Import → glTF), then File → Export → FBX.</p>
        </div>
      </div>
    </nav>
  </header>

  <main class="layout">
    <section class="viewport">
      <canvas id="scene" aria-label="3D avatar preview. Drag to rotate, scroll to zoom."></canvas>
      <div id="poses" class="poses" role="group" aria-label="Pose"></div>
      <div class="view-tools">
        <button id="spin" title="Auto-rotate">⟳</button>
        <button id="closeup" title="Face close-up">☺</button>
        <button id="recenter" title="Full body view">⌖</button>
      </div>
      <p class="hint">Drag to rotate · scroll to zoom</p>
      <div id="loading" class="loading" hidden>
        <p id="loading-text">Loading…</p>
        <div class="bar"><div id="loading-bar"></div></div>
      </div>
    </section>

    <aside class="panel">
      <h2>Choose a person</h2>
      <div id="presets" class="presets"></div>
      <h2>Customize</h2>
      <div id="options"></div>
    </aside>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
